services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: thyroid-api:local
    restart: unless-stopped

  web:
    build: ./frontend
    image: thyroid-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
